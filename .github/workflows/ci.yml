name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: 01-first-container

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run SAST with Semgrep
        run: semgrep scan --config p/python --error .   

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install security tools
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build --pull --no-cache -t cody-first-app:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cody-first-app:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        run: docker tag cody-first-app:ci ghcr.io/avgdadtech/devsecops-lab:${{ github.sha }}

      - name: Push Docker image
        run: docker push ghcr.io/avgdadtech/devsecops-lab:${{ github.sha }}
